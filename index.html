<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sala de Estar — Conversa com Ana</title>
<style>
:root{--cream:#fff9ec;--paper:#fbf3e6;--navy:#1e2d40;--ink:#1f2a37;--green:#087b55;--sent:#d9f5c7;--yellow:#f2c230}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Verdana,'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--cream)}
.app{height:100dvh;min-height:370px;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.status{flex:0 0 39px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;background:var(--cream);font-size:16px;font-weight:700}
.signals{display:flex;align-items:center;gap:6px}.bars{display:flex;align-items:end;gap:2px;height:15px}.bars i{width:3px;background:var(--ink);border-radius:1px}.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:11px}.bars i:nth-child(4){height:15px}
.battery{position:relative;display:inline-block;width:22px;height:12px;border:2px solid var(--ink);border-radius:3px;padding:2px}.battery:before{content:'';display:block;background:#46b460;width:100%;height:100%}.battery:after{content:'';position:absolute;right:-5px;top:2px;width:2px;height:5px;background:var(--ink)}
.header{background:var(--green);color:white;display:flex;align-items:center;gap:9px;min-height:66px;padding:9px 13px}
.back{font-size:27px;line-height:1}.avatar{width:40px;height:40px;flex-shrink:0;border-radius:50%;background:#ffe8b0;border:2px solid white;display:grid;place-items:center;font-size:23px}.who{flex:1;min-width:0}.who b{font-size:19px;display:block}.who small{font-size:12px;display:block}.camera{font-size:20px}.menu{font-size:25px}
.conversation{flex:1;min-height:0;overflow:auto;padding:13px 12px 24px;background:var(--paper);background-image:radial-gradient(circle at 18% 27%,#e7d9c644 0 2px,transparent 3px),radial-gradient(circle at 73% 62%,#e7d9c655 0 3px,transparent 4px);background-size:55px 68px;scroll-behavior:smooth}
.date{width:max-content;margin:0 auto 16px;background:white;border-radius:14px;padding:4px 14px;font-size:13px;font-weight:700;box-shadow:0 2px 5px #0001}
.bubble{position:relative;max-width:87%;border-radius:15px;background:white;box-shadow:0 2px 6px #0002;padding:12px 12px 24px;margin:0 auto 14px 0;font-size:clamp(15px,3.35vw,20px);line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.sent{margin-left:auto;margin-right:0;background:var(--sent)}
.stamp{position:absolute;bottom:5px;right:9px;font-size:10px;color:#5c6c73}.stamp em{font-style:normal;color:#1a80bb;font-weight:800}
.bubble.voice{display:flex;align-items:center;gap:8px;padding:14px 12px 25px;max-width:94%}.voice-play{border:0;background:transparent;cursor:pointer;color:#096e49;font-size:21px;padding:3px}.waves{display:flex;align-items:center;gap:2px;flex:1;height:22px;min-width:25px}.waves i{height:var(--h);background:#5b9281;border-radius:4px;width:3px;flex:1;max-width:5px}.voice-time{font-size:12px;color:#50645e;white-space:nowrap}
.composer{flex-shrink:0;display:flex;gap:7px;align-items:center;padding:8px 8px 10px;background:var(--cream);border-top:1px solid #e7dccd;min-height:65px}
.field{min-width:0;flex:1;display:flex;align-items:center;gap:7px;background:white;border:2px solid #cdd2d5;border-radius:25px;padding:4px 9px;min-height:48px}
.field:focus-within{border-color:#1e4e8c;box-shadow:0 0 0 2px #cfe6f7}.smile{font-size:21px;color:#697785}
.input{width:100%;min-width:0;flex:1;border:0;outline:0;font-size:clamp(14px,3.2vw,19px);font-family:inherit;color:var(--ink);background:transparent;padding:5px 0}
.input::placeholder{color:#78848c}
.round{border:0;border-radius:50%;height:49px;width:49px;flex-shrink:0;display:grid;place-items:center;background:var(--green);color:white;cursor:pointer;font-size:22px}
.round:disabled{opacity:.5;cursor:default}.round:focus-visible,.tool:focus-visible,.voice-play:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.mic-icon,.pause-icon,.play-icon,.send-icon,.trash-icon{display:block;width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.recording,.preview{flex-shrink:0;display:flex;align-items:center;gap:9px;background:var(--cream);padding:7px 8px;min-height:65px;border-top:1px solid #e7dccd}
.tool{border:0;background:transparent;color:#52636c;display:grid;place-items:center;border-radius:50%;width:43px;height:43px;flex-shrink:0;cursor:pointer}
.tool svg{width:23px;height:23px}.rec-center{min-width:0;display:flex;align-items:center;gap:6px;flex:1;font-size:14px;font-weight:700}.red-dot{width:10px;height:10px;border-radius:50%;background:#d53b31;flex-shrink:0;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.4}}.elapsed{white-space:nowrap}.training-label{font-size:11px;font-weight:400;color:#52636c;line-height:1.2}.record-actions{display:flex;gap:5px}
.preview-info{display:flex;align-items:center;gap:6px;flex:1;min-width:0}.preview-info .waves{min-width:0;max-width:none}.preview .voice-time{font-size:12px}.voice-hint{font-size:11px;color:#52636c}
.nav{height:47px;flex:0 0 47px;background:var(--navy);display:flex;justify-content:space-around;align-items:center;color:#fff}
.recent{height:20px;display:flex;gap:3px;align-items:center}.recent i{height:18px;width:3px;background:#fff;border-radius:1px}.home{width:18px;height:18px;border:3px solid white;border-radius:6px}.prev{width:13px;height:13px;border-bottom:3px solid white;border-left:3px solid white;transform:rotate(45deg)}
.completion{display:none;border:2px solid #2e7d32;background:#e2f4df;border-radius:12px;margin:12px 0 0;padding:13px 11px;font-size:clamp(13px,3vw,17px);line-height:1.4}
.completion.show{display:block}
.completion .finish-title{display:flex;align-items:center;gap:6px;font-size:clamp(15px,3.35vw,20px);font-weight:800;color:#245e2b;margin-bottom:5px}
.completion .finish-title .check{display:grid;place-items:center;background:#2e7d32;color:#fff;border-radius:50%;width:25px;height:25px;flex-shrink:0;font-size:17px}
.completion p{margin:5px 0 0}
.donebar{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:63px;border-top:1px solid #bdd9b5;background:#e2f4df;color:#245e2b;font-weight:800;font-size:clamp(13px,3vw,17px);padding:8px}
.donebar .done-icon{display:grid;place-items:center;background:#2e7d32;color:#fff;border-radius:50%;width:26px;height:26px}

.notice{position:absolute;bottom:117px;left:9%;right:9%;background:#fff9ec;color:var(--ink);padding:8px;border:2px solid var(--yellow);border-radius:10px;box-shadow:0 2px 10px #0002;font-size:12px;text-align:center;display:none}.notice.show{display:block}
[hidden]{display:none!important}
@media(max-width:330px){.status{flex-basis:27px;font-size:11px;padding:0 11px}.header{min-height:48px;padding:5px 7px;gap:6px}.back{font-size:23px}.avatar{height:30px;width:30px;font-size:17px}.who b{font-size:14px}.who small{font-size:10px}.camera{font-size:15px}.menu{font-size:18px}.conversation{padding:9px 7px 17px}.bubble{font-size:13px;padding:9px 9px 19px}.date{font-size:10px;margin-bottom:10px}.composer,.recording,.preview{min-height:50px;padding:5px;gap:4px}.field{min-height:40px;padding:3px 5px}.input{font-size:12px}.smile{font-size:16px}.round{width:38px;height:38px;font-size:17px}.round svg{width:20px;height:20px}.tool{width:30px;height:35px}.tool svg{width:20px}.recording .training-label{font-size:8px}.rec-center{font-size:10px}.voice-hint{display:none}.nav{height:34px;flex-basis:34px}.recent{height:15px}.recent i{height:14px}.home{width:14px;height:14px}.prev{width:11px;height:11px}.waves{gap:1px}}
@media(prefers-reduced-motion:reduce){.red-dot{animation:none}.conversation{scroll-behavior:auto}}
</style>
</head>

<script>
(function(){
  const el=id=>document.getElementById(id);
  const chat=el('chat'), form=el('composer'),input=el('input'),mic=el('mic'),sendText=el('sendText');
  const recording=el('recording'),preview=el('preview'), timer=el('timer'), length=el('voiceLength');
  const notice=el('notice');
  let audioStage='idle',hasText=false, clock=null,seconds=0,noticeTimeout=null;
  const sampleAudio=el('sampleAudio');
  const sampleDuration=16; // Duração arredondada do MP3 (16,12 segundos).
  const resetSound=()=>{sampleAudio.pause();sampleAudio.currentTime=0};
  const time=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  function jumpBottom(){chat.scrollTop=chat.scrollHeight}
  function showNotice(str){clearTimeout(noticeTimeout);notice.textContent=str;notice.classList.add('show');noticeTimeout=setTimeout(()=>notice.classList.remove('show'),3200)}
  function bubble(text,kind){const b=document.createElement('div');b.className='bubble '+kind;b.append(document.createTextNode(text));const stamp=document.createElement('span');stamp.className='stamp';stamp.textContent=time()+' ';if(kind==='sent'){const t=document.createElement('em');t.textContent='✓✓';stamp.append(t)}b.append(stamp);chat.insertBefore(b,el('completion'));jumpBottom();return b}
  function updateCompose(){const typed=!!input.value.trim();mic.hidden=typed;sendText.hidden=!typed}
  input.addEventListener('input',updateCompose);updateCompose();
  form.addEventListener('submit',e=>{
    e.preventDefault();if(!input.value.trim())return;
    bubble(input.value.trim(),'sent');input.value='';updateCompose();
    if(!hasText){hasText=true;setTimeout(()=>{bubble('Que bom! Você pode me mandar um áudio contando como vocês estão?','received');showNotice('Toque no microfone para praticar o envio de áudio.');},450)}
  });
  function wave(container){container.innerHTML='';const sizes=[11,19,13,23,16,8,18,21,12,24,17,9,16,12,20,14,10,17];sizes.forEach(n=>{const bar=document.createElement('i');bar.style.setProperty('--h',n+'px');container.append(bar)})}
  wave(el('wavePreview'));
  function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
  function stopTimer(){if(clock){clearInterval(clock);clock=null}}
  function startAudio(){if(!hasText){showNotice('Primeiro, envie uma mensagem de texto para Ana.');return}if(audioStage==='sent')return;stopTimer();seconds=0;timer.textContent='00:00';audioStage='recording';form.hidden=true;preview.hidden=true;recording.hidden=false;clock=setInterval(()=>{seconds+=1;timer.textContent=fmt(seconds)},1000);showNotice('Treino visual: nenhum áudio está sendo gravado. Clique em Pausar para revisar.')}
  function discard(){stopTimer();resetSound();recording.hidden=true;preview.hidden=true;form.hidden=false;audioStage='idle';showNotice('Áudio descartado. Você pode tentar novamente.')}
  mic.addEventListener('click',startAudio);el('discardRecording').addEventListener('click',discard);el('deleteAudio').addEventListener('click',discard);
  el('pause').addEventListener('click',()=>{if(audioStage!=='recording')return;stopTimer();audioStage='preview';recording.hidden=true;preview.hidden=false;length.textContent=fmt(sampleDuration);showNotice('Você pode ouvir a voz de Dona Rosa, descartar ou enviar a mensagem ilustrativa.')});
  function speak(){resetSound();const result=sampleAudio.play();if(result && typeof result.catch==='function')result.catch(()=>showNotice('Não foi possível reproduzir o áudio. Clique novamente para tentar.'))}
  el('playSample').addEventListener('click',speak);
  function audioBubble(){const b=document.createElement('div');b.className='bubble sent voice';const play=document.createElement('button');play.className='voice-play';play.type='button';play.setAttribute('aria-label','Ouvir áudio da Dona Rosa');play.textContent='▶';play.addEventListener('click',speak);b.append(play);const waves=document.createElement('div');waves.className='waves';wave(waves);b.append(waves);const duration=document.createElement('span');duration.className='voice-time';duration.textContent=fmt(sampleDuration);b.append(duration);const stamp=document.createElement('span');stamp.className='stamp';stamp.textContent=time()+' ';const checks=document.createElement('em');checks.textContent='✓✓';stamp.append(checks);b.append(stamp);chat.insertBefore(b,el('completion'));jumpBottom()}
  el('sendAudio').addEventListener('click',()=>{
    if(audioStage!=='preview')return;
    resetSound();audioStage='sent';preview.hidden=true;form.hidden=true;
    el('donebar').hidden=false;
    clearTimeout(noticeTimeout);notice.classList.remove('show');
    audioBubble();
    setTimeout(()=>{
      bubble('Muito obrigada, mãe! Fiquei muito feliz em receber sua mensagem! ❤️','received');
      el('completion').classList.add('show');
      jumpBottom();
    },650);
  });
})();
</script>
